<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pisAmberW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca311" />
      <stop offset="100%" stop-color="#e0910f" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (PIS Stylized Industrial Monogram) -->
  <g transform="translate(2, 4) scale(0.92)">
    <!-- Outer Amber P Bracket -->
    <path d="M 0 0 L 52 0 C 76 0 92 12 92 34 C 92 56 76 66 52 66 L 24 66 L 24 100 L 0 100 Z M 24 18 L 24 48 L 50 48 C 62 48 70 42 70 34 C 70 26 62 18 50 18 Z" fill="url(#pisAmberW)" />
    <!-- Inner S loop & pivot dot (Pure White #ffffff) -->
    <circle cx="48" cy="42" r="7" fill="#ffffff" />
    <path d="M 48 54 C 64 54 76 62 76 76 C 76 90 62 100 42 100 L 22 100 L 22 84 L 42 84 C 50 84 54 80 54 76 C 54 72 50 68 42 68 L 34 68 C 24 68 18 62 18 54 L 36 54 C 36 56 38 58 42 58 L 48 58 C 48 56 48 54 48 54 Z" fill="#ffffff" />
    <!-- Amber lower wing extension -->
    <path d="M 40 84 L 86 84 C 94 84 100 78 100 70 C 100 62 94 56 86 56 L 78 56 L 78 72 L 86 72 C 88 72 90 74 90 76 C 90 78 88 80 86 80 L 40 80 Z" fill="url(#pisAmberW)" />
  </g>

  <!-- Typography with Space Grotesk & Plus Jakarta Sans -->
  <g transform="translate(108, 4)">
    <!-- POWER -->
    <text x="0" y="28" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="32" letter-spacing="1.5" fill="#fca311">POWER</text>
    <!-- INDUSTRIAL -->
    <text x="0" y="55" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="25" letter-spacing="1.2" fill="#ffffff">INDUSTRIAL</text>
    <!-- SOLUTIONS -->
    <text x="0" y="82" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="25" letter-spacing="1.2" fill="#e5e5e5">SOLUTIONS</text>
    <!-- SINCE 2010 -->
    <text x="162" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.5" fill="#fca311">SINCE 2010</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="352" y1="8" x2="352" y2="92" stroke="#e5e5e5" stroke-opacity="0.3" stroke-width="2" />

  <!-- Core Pillars Tag -->
  <g transform="translate(366, 8)">
    <!-- Civil -->
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#14213d" stroke="#e5e5e5" stroke-opacity="0.25" />
    <rect x="0" y="0" width="3.5" height="24" rx="1.5" fill="#fca311" />
    <text x="47" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">CIVIL</text>
    
    <!-- Mechanical -->
    <rect x="0" y="30" width="90" height="24" rx="4" fill="#14213d" stroke="#e5e5e5" stroke-opacity="0.25" />
    <rect x="0" y="30" width="3.5" height="24" rx="1.5" fill="#fca311" />
    <text x="47" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" letter-spacing="0.8" fill="#ffffff" text-anchor="middle">MECHANICAL</text>
    
    <!-- Electrical -->
    <rect x="0" y="60" width="90" height="24" rx="4" fill="#14213d" stroke="#e5e5e5" stroke-opacity="0.25" />
    <rect x="0" y="60" width="3.5" height="24" rx="1.5" fill="#fca311" />
    <text x="47" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" letter-spacing="0.8" fill="#ffffff" text-anchor="middle">ELECTRICAL</text>
  </g>
</svg>
